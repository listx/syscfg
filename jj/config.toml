[user]
"name" = "Linus Arver"
"email" = "linus@ucla.edu"

[aliases]
sync = ["util", "exec", "--", "bash", "-euc", '''
if (( $# > 1 )); then
  echo "usage: jj sync [REVSET]" >&2
  exit 1
fi
dest="upstream_trunk()"
if (( $# == 1 )); then
  dest="($1)"
fi
jj bookmark list --all-remotes -T 'name ++ "\t" ++ remote ++ "\t" ++ tracked ++ "\n"' |
  awk -F'\t' '
    $2 == "" { local[$1] = 1 }
    $2 != "" && $2 != "git" && $3 == "false" { untracked[$1] = 1 }
    END {
      for (n in untracked)
        if (n in local && n !~ /^(main|master|develop)$/) print n
    }' |
  while read -r name; do
    jj bookmark track "exact:$name"
  done
exec jj rebase -b "$dest..((visible_heads() ~ remote_bookmarks()) | bookmarks())" -d "$dest"
''', "jj-sync"]

[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | shared_remote_bookmarks()"
"shared_remote_bookmarks()" = 'remote_bookmarks(exact:"main") | remote_bookmarks(exact:"master") | remote_bookmarks(exact:"develop")'
"upstream_trunk()" = 'coalesce(latest(remote_bookmarks(exact:"main")), latest(remote_bookmarks(exact:"master")))'

[lazyjj]
layout = "vertical"

[templates]
draft_commit_description = '''
concat(
  coalesce(description, default_commit_description, "\n"),
  if(
    description.contains("Signed-off-by:"),
    "",
    concat(
      "\nSigned-off-by: ",
      self.author().name(),
      " <",
      self.author().email(),
      ">"
    )
  ),
  "\n\n",
  "JJ: --------------------------------------------------------------------\n",
  "JJ: ignore-rest\n",
  surround(
    "#+begin_src txt\n", "#+end_src\n",
    indent("    ", diff.stat(72)),
  ),
  "#+begin_src diff\n",
  diff.git(),
  "#+end_src\n",
)
'''

[colors]
# Diff chunks.
"diff added token" = { fg = "#335533", bg = "#ccffcc", bold = true, underline = false }
"diff removed token" = { fg = "#553333", bg = "#ffcccc", bold = true, underline = false  }

# There are for the line numbers in the left margin, next to the diff chunk lines.
"diff added" = { fg = "#ccffcc", bold = true }
"diff removed" = { fg = "#ffcccc", bold = true }

[ui]
conflict-marker-style = "git"
merge-editor = "meld"
