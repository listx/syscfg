name = "Linus Arver's Dotfiles"
homepage = "https://syscfg.funloop.org"
repo = "https://git.sr.ht/~listx/syscfg"
version = ""
nonTangledPathspecs = [ #
   ":(exclude,top).gitmodules",
   ":(exclude,top).lilac.json",
   ":(exclude,top)README.md",
   ":(exclude,top)LICENSE",
   ":(exclude,top)clojure",
   ":(exclude,top)doc/*.org",
   ":(exclude,top)emacs/doom-cfg/snippets/.gitkeep",
   ":(exclude,top)emacs/doom-upstream",
   ":(exclude,top)Cargo.lock",
   ":(exclude,top)gpg",
   ":(exclude,top)jjui",
   ":(exclude,top)karabiner",
   ":(exclude,top)lesskey",
   ":(exclude,top)melby",
   ":(exclude,top)mpd",
   ":(exclude,top)mpv",
   ":(exclude,top)nix",
   ":(exclude,top)nixos",
   ":(exclude,top)nixpkgs",
   ":(exclude,top)nvim",
   ":(exclude,top)openvpn",
   ":(exclude,top)pulse",
   ":(exclude,top)qutebrowser",
   ":(exclude,top)rtorrent",
   ":(exclude,top)ssh",
   ":(exclude,top)terminfo",
   ":(exclude,top)tig",
   ":(exclude,top)tmux",
   ":(exclude,top)vimpc",
   ":(exclude,top)wezterm",
   ":(exclude,top)nixos",
   ":(exclude,top)script",
   ":(exclude,top)uim",
   ":(exclude,top)vim",
   ":(exclude,top)xmonad",
   ":(exclude,top)xorg",
   ":(exclude,top)zathura",
   ":(exclude,top)zsh"
]

[htmlHead]
onlyLocalImports = true
injection = """
<link rel="stylesheet" href="/vendor/source-fonts/source-fonts.css">
<script>
  window.MathJax = {
      loader: { paths: { "mathjax-newcm": "/vendor/mathjax-newcm-font" } },
      output: { font: "mathjax-newcm" },
  tex: {
      tags: 'ams'
  },
  options: {
      ignoreHtmlClass: 'verbatim|code'
  }
};
</script>
<script id="MathJax-script" async="" src="/vendor/mathjax/tex-mml-chtml.js"></script>
"""
