   ":(exclude,top).lilac.json",
   ":(exclude,top)README.md",
   ":(exclude,top)LICENSE",
   ":(exclude,top)clojure",
   ":(exclude,top)doc/*.org",
   ":(exclude,top)emacs/doom-cfg/snippets/.gitkeep",
   ":(exclude,top)emacs/doom-upstream",
   ":(exclude,top)Cargo.lock",
   ":(exclude,top)gpg",
   ":(exclude,top)jjui",
   ":(exclude,top)karabiner",
   ":(exclude,top)lesskey",
   ":(exclude,top)melby",
   ":(exclude,top)mpd",
   ":(exclude,top)mpv",
   ":(exclude,top)nix",
   ":(exclude,top)nixos/k0/hardware-configuration.nix",
   ":(exclude,top)nixos/m0",
   ":(exclude,top)nixos/w0",
   ":(exclude,top)nvim",
   ":(exclude,top)openvpn",
   ":(exclude,top)pulse",
   ":(exclude,top)qutebrowser",
   ":(exclude,top)rtorrent",
   ":(exclude,top)ssh",
   ":(exclude,top)terminfo",
   ":(exclude,top)vimpc",
   ":(exclude,top)wezterm/upstream",
   ":(exclude,top)script/doom",
   ":(exclude,top)script/git/hooks/prepare-commit-msg",
   ":(exclude,top)uim",
   ":(exclude,top)vim",
   ":(exclude,top)xmonad/.xsession",
   ":(exclude,top)xmonad/HLint.hs",
   ":(exclude,top)xmonad/build",
   ":(exclude,top)xmonad/mac-host-ubuntu-guest-setup.md",
   ":(exclude,top)xmonad/recompile.sh",
   ":(exclude,top)xmonad/restart.sh",
