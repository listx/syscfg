name = "Linus Arver's Dotfiles"
homepage = "https://syscfg.funloop.org"
repo = "https://github.com/listx/syscfg"
version = ""
nonTangledPathspecs = [ #
   ":(exclude,top).gitmodules",
   ":(exclude,top).lilac.json",
   ":(exclude,top)README.md",
   ":(exclude,top)LICENSE",
   ":(exclude,top)clojure",
   ":(exclude,top)doc/*.org",
   ":(exclude,top)emacs/doom-cfg/snippets/.gitkeep",
   ":(exclude,top)emacs/doom-upstream",
   ":(exclude,top)Cargo.lock",
   ":(exclude,top)karabiner",
   ":(exclude,top)nix/sources.json",
   ":(exclude,top)nix/sources.nix",
   ":(exclude,top)nixos/k0/hardware-configuration.nix",
   ":(exclude,top)nixos/m0/hardware-configuration.nix",
   ":(exclude,top)nvim",
   ":(exclude,top)openvpn",
   ":(exclude,top)qutebrowser/blocked-hosts",
   ":(exclude,top)qutebrowser/keys.conf",
   ":(exclude,top)qutebrowser/qutebrowser.conf",
   ":(exclude,top)rtorrent",
   ":(exclude,top)wezterm/upstream",
   ":(exclude,top)script/doom",
   ":(exclude,top)script/git/hooks/prepare-commit-msg",
   ":(exclude,top)uim",
   ":(exclude,top)xmonad/build",
   ":(exclude,top)xorg",
   ":(exclude,top)zsh/zcomet-upstream"
]

[htmlHead]
onlyLocalImports = true
injection = """
<link rel="stylesheet" href="/vendor/source-fonts/source-fonts.css">
<script>
  window.MathJax = {
      loader: { paths: { "mathjax-newcm": "/vendor/mathjax-newcm-font" } },
      output: { font: "mathjax-newcm" },
  tex: {
      tags: 'ams'
  },
  options: {
      ignoreHtmlClass: 'verbatim|code'
  }
};
</script>
<script id="MathJax-script" async="" src="/vendor/mathjax/tex-mml-chtml.js"></script>
"""
