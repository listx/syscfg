# See [1] for the default configuration.
#
# [1] https://github.com/idursun/jjui/blob/main/internal/config/default/config.toml

[keys]
  [keys.inline_describe]
    mode = ["p"]
  [keys.preview]
    mode = ["enter"]
    scroll_up = ["ctrl+k"]
    scroll_down = ["ctrl+j"]

[ui.colors]
"selected" = {bg = "#22222f", bold = true }
"status title" = { fg = "#000000", bg = "red", bold = true }
